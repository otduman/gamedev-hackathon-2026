<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Rise of Nomads — Wireframes</title>
<meta name="viewport" content="width=1400" />
<link rel="stylesheet" href="styles.css" />
<style>
  body { background: #e9e1cd; }
  #canvas-root { width: 100%; height: 100vh; }
  /* override DC backgrounds for sketch feel */
  .dc-canvas { background: #ddd2b8 !important; }
</style>
<script>
  window.RON_TWEAKS_DEFAULTS = /*EDITMODE-BEGIN*/{
    "ornaments": true,
    "tooltipVisible": true,
    "activeFaction": "kazakh",
    "phase": "reinforce"
  }/*EDITMODE-END*/;
</script>
</head>
<body>
<div id="canvas-root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components/primitives.jsx"></script>
<script type="text/babel" src="components/menus.jsx"></script>
<script type="text/babel" src="components/huds.jsx"></script>
<script type="text/babel" src="components/screens.jsx"></script>
<script type="text/babel" src="components/tweaks.jsx"></script>

<script type="text/babel">
const App = () => (
  <>
    <DesignCanvas title="Rise of Nomads — Wireframe Explorer" subtitle="6 screens · 3 variations each · low-fi sketch with faction-color hints">
      <DCSection id="menu" title="01 · Main Menu" subtitle="Title, START / OPTIONS / QUIT, hotseat leader portraits">
        <DCArtboard id="menu-a" label="A · Carved plaque, symmetrical" width={1280} height={760}><MenuA /></DCArtboard>
        <DCArtboard id="menu-b" label="B · Asymmetric, leader strip" width={1280} height={760}><MenuB /></DCArtboard>
        <DCArtboard id="menu-c" label="C · Map-table metaphor" width={1280} height={760}><MenuC /></DCArtboard>
      </DCSection>

      <DCSection id="hud" title="02 · In-Game HUD" subtitle="Top bar: turn / phase / leader / prestige / end turn. Empire panel + tooltip + phase rail">
        <DCArtboard id="hud-a" label="A · Balanced (rail + side stack)" width={1280} height={760}><HudA /></DCArtboard>
        <DCArtboard id="hud-b" label="B · Sparse (info on demand)" width={1280} height={760}><HudB /></DCArtboard>
        <DCArtboard id="hud-c" label="C · Rich (Civ-like dock)" width={1280} height={760}><HudC /></DCArtboard>
      </DCSection>

      <DCSection id="combat" title="03 · Combat Dice Overlay" subtitle="Risk-style: up to 3 atk / 2 def · forest die · defender wins ties">
        <DCArtboard id="combat-a" label="A · Two physical mats" width={1280} height={760}><CombatA /></DCArtboard>
        <DCArtboard id="combat-b" label="B · Centered modal" width={1280} height={760}><CombatB /></DCArtboard>
        <DCArtboard id="combat-c" label="C · Bottom drawer (non-blocking)" width={1280} height={760}><CombatC /></DCArtboard>
      </DCSection>

      <DCSection id="tooltip" title="04 · Tile Tooltip" subtitle="Terrain / owner / warriors / move cost / key region / contested">
        <DCArtboard id="tooltip-a" label="A · Compact felt" width={720} height={380}><TooltipA /></DCArtboard>
        <DCArtboard id="tooltip-b" label="B · Detailed (shift-hover)" width={720} height={480}><TooltipB /></DCArtboard>
        <DCArtboard id="tooltip-c" label="C · Contested state" width={720} height={380}><TooltipC /></DCArtboard>
      </DCSection>

      <DCSection id="gameover" title="05 · Game Over" subtitle="Winner avatar, final stats, Play Again / Main Menu">
        <DCArtboard id="go-a" label="A · Plaque centered" width={1280} height={760}><GameOverA /></DCArtboard>
        <DCArtboard id="go-b" label="B · 4-up scoreboard" width={1280} height={760}><GameOverB /></DCArtboard>
        <DCArtboard id="go-c" label="C · Cinematic split + timeline" width={1280} height={760}><GameOverC /></DCArtboard>
      </DCSection>

      <DCSection id="hotseat" title="06 · Hotseat Leader Select" subtitle="Pick two leaders for a local 2-player session">
        <DCArtboard id="hs-a" label="A · Side-by-side picker" width={1280} height={760}><HotseatA /></DCArtboard>
        <DCArtboard id="hs-b" label="B · Carousel (one big card)" width={1280} height={760}><HotseatB /></DCArtboard>
        <DCArtboard id="hs-c" label="C · Pass-the-device handoff" width={1280} height={760}><HotseatC /></DCArtboard>
      </DCSection>
    </DesignCanvas>
    <RonTweaks />
  </>
);

ReactDOM.createRoot(document.getElementById('canvas-root')).render(<App />);
</script>

</body>
</html>
