<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Rise of Nomads — Wireframes v2</title>
<meta name="viewport" content="width=1400" />
<link rel="stylesheet" href="styles.css" />
<style>
  body { background: #e9e1cd; }
  #canvas-root { width: 100%; height: 100vh; }
  .dc-canvas { background: #ddd2b8 !important; }
</style>
<script>
  window.RON_TWEAKS_DEFAULTS = /*EDITMODE-BEGIN*/{
    "ornaments": true,
    "tooltipVisible": true,
    "activeFaction": "kazakh",
    "phase": "reinforce"
  }/*EDITMODE-END*/;
</script>
</head>
<body>
<div id="canvas-root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components/primitives.jsx"></script>
<script type="text/babel" src="components/menus.jsx"></script>
<script type="text/babel" src="components/huds-v2.jsx"></script>
<script type="text/babel" src="components/screens.jsx"></script>
<script type="text/babel" src="components/screens-v2.jsx"></script>
<script type="text/babel" src="components/tweaks.jsx"></script>

<script type="text/babel">
const App = () => (
  <>
    <DesignCanvas title="Rise of Nomads — Wireframes v2" subtitle="Classic Risk rules · 4 phases · secret missions · updated HUD + combat + tooltips">
      <DCSection id="menu" title="01 · Main Menu" subtitle="Title, START / OPTIONS / QUIT, hotseat leader portraits">
        <DCArtboard id="menu-a" label="A · Carved plaque, symmetrical" width={1280} height={760}><MenuA /></DCArtboard>
        <DCArtboard id="menu-b" label="B · Asymmetric, leader strip" width={1280} height={760}><MenuB /></DCArtboard>
        <DCArtboard id="menu-c" label="C · Map-table metaphor" width={1280} height={760}><MenuC /></DCArtboard>
      </DCSection>

      <DCSection id="hud" title="02 · In-Game HUD (updated)" subtitle="4 phases: Setup / Reinforce / Attack / Fortify · Secret mission · Empire roster with territory + warrior counts">
        <DCArtboard id="hud-a2" label="A · Balanced (top bar + side roster)" width={1280} height={760}><HudA2 /></DCArtboard>
        <DCArtboard id="hud-b2" label="B · Sparse (floating pill, info on demand)" width={1280} height={760}><HudB2 /></DCArtboard>
        <DCArtboard id="hud-c2" label="C · Rich (full chrome + bottom dock)" width={1280} height={760}><HudC2 /></DCArtboard>
      </DCSection>

      <DCSection id="combat" title="03 · Combat Dice Overlay (updated)" subtitle="Risk-style: up to 3 atk / 2 def · territory names · defender wins ties">
        <DCArtboard id="combat-a2" label="A · Two physical mats" width={1280} height={760}><CombatA2 /></DCArtboard>
        <DCArtboard id="combat-b2" label="B · Centered modal" width={1280} height={760}><CombatB2 /></DCArtboard>
        <DCArtboard id="combat-c2" label="C · Bottom drawer (non-blocking)" width={1280} height={760}><CombatC2 /></DCArtboard>
      </DCSection>

      <DCSection id="tooltip" title="04 · Tile Tooltip (simplified)" subtitle="City name · owner · warrior count only">
        <DCArtboard id="tt-a2" label="A · Compact felt" width={600} height={280}><TooltipA2 /></DCArtboard>
        <DCArtboard id="tt-b2" label="B · Horizontal row" width={600} height={280}><TooltipB2 /></DCArtboard>
        <DCArtboard id="tt-c2" label="C · Neutral / unowned" width={600} height={280}><TooltipC2 /></DCArtboard>
      </DCSection>

      <DCSection id="gameover" title="05 · Game Over" subtitle="Winner avatar, final stats, Play Again / Main Menu">
        <DCArtboard id="go-a" label="A · Plaque centered" width={1280} height={760}><GameOverA /></DCArtboard>
        <DCArtboard id="go-b" label="B · 4-up scoreboard" width={1280} height={760}><GameOverB /></DCArtboard>
        <DCArtboard id="go-c" label="C · Cinematic split + timeline" width={1280} height={760}><GameOverC /></DCArtboard>
      </DCSection>

      <DCSection id="hotseat" title="06 · Hotseat Leader Select" subtitle="Pick leaders for local 4-player session">
        <DCArtboard id="hs-a" label="A · Side-by-side picker" width={1280} height={760}><HotseatA /></DCArtboard>
        <DCArtboard id="hs-b" label="B · Carousel (one big card)" width={1280} height={760}><HotseatB /></DCArtboard>
        <DCArtboard id="hs-c" label="C · Pass-the-device handoff" width={1280} height={760}><HotseatC /></DCArtboard>
      </DCSection>
    </DesignCanvas>
    <RonTweaks />
  </>
);

ReactDOM.createRoot(document.getElementById('canvas-root')).render(<App />);
</script>

</body>
</html>
